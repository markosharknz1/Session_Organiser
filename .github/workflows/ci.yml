name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run csv:test
      - run: npm run autogen:test
      - run: npm run report:test
      - run: npm run roundbuilder:test
      - run: npm run launcher:test
      - name: Launcher and server load
        run: |
          node --check launcher.js
          node --check lib/appWindow.js
          node -e "require('./routes/launcher')"
          test -f "Game Scheduler.cmd" && test -f launcher/setup.html
          # The download's only scripts are two plain batch files (start and
          # stop). No PowerShell, no Windows Script Host - see SECURITY.md.
          # Checked on what actually ships (git archive honours export-ignore).
          ! git archive --format=tar HEAD | tar -t | grep -Ei '\.(ps1|psm1|vbs|vbe|wsf|jse|hta)$'
